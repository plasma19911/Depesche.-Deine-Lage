name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "0 */3 * * *"   # alle 3 Stunden (UTC)
  workflow_dispatch:          # Knopf zum manuellen Auslösen

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Nachrichten abrufen
        run: python fetch_news.py

      - name: Änderungen committen
        run: |
          git config user.name  "news-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "Nachrichten aktualisiert: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Keine Änderungen."
          fi
